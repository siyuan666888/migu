name: 自动生成咪咕源
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 运行脚本
        run: node migu.js
      - name: 提交
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github@xx.com"
          git add migu.m3u .migu_lnss_cache.json
          git commit -m "自动更新咪咕源" || echo "无更新"
          git push
